<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-label="Diagram comparing the same enabled firewall rule under two network profiles. On the left the receiving interface is classified Public, the OpenSSH rule is scoped to Private, so it is never evaluated and the default inbound block drops the packet. On the right the interface has been set to Private, the same rule now matches, and the connection reaches the listening service.">
  <style>
    .g   { fill: #eef1f5; }
    .box { fill: #ffffff; stroke: #b3bcc7; stroke-width: 1.5; }
    .pan { fill: none; stroke: #b3bcc7; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .bad { fill: #ffffff; stroke: #c2382e; stroke-width: 2; }
    .ok  { fill: #ffffff; stroke: #0e7f78; stroke-width: 2; }
    .ink { fill: #14181d; }
    .mut { fill: #5c6673; }
    .ln  { stroke: #6f7a87; stroke-width: 2; fill: none; }
    .lnr { stroke: #c2382e; stroke-width: 2; fill: none; }
    .lng { stroke: #0e7f78; stroke-width: 2.5; fill: none; }
    .red { fill: #c2382e; }
    .tea { fill: #0e7f78; }
    .ttl { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .hd  { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 1px; }
    .lbl { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sml { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono{ font: 400 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tiny{ font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .g   { fill: #171a1f; }
      .box { fill: #222831; stroke: #414b57; }
      .pan { stroke: #414b57; }
      .bad { fill: #222831; stroke: #e8695c; }
      .ok  { fill: #222831; stroke: #3fbdb3; }
      .ink { fill: #e9edf2; }
      .mut { fill: #9aa5b1; }
      .ln  { stroke: #8b95a1; }
      .lnr { stroke: #e8695c; }
      .lng { stroke: #3fbdb3; }
      .red { fill: #e8695c; }
      .tea { fill: #3fbdb3; }
    }
  </style>
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f7a87"/>
    </marker>
    <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2382e"/>
    </marker>
    <marker id="p3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7f78"/>
    </marker>
  </defs>

  <rect class="g" x="0" y="0" width="1080" height="600"/>
  <text class="ttl ink" x="40" y="44">Same rule, same service, same packet — the profile decides</text>
  <text class="sml mut" x="40" y="68">a firewall rule can be Enabled and still be invisible to your traffic</text>

  <rect class="pan" x="40" y="92" width="480" height="404" rx="12"/>
  <rect class="pan" x="560" y="92" width="480" height="404" rx="12"/>

  <text class="hd red" x="64" y="122">A NEW INTERFACE, LEFT AS WINDOWS FOUND IT</text>
  <text class="hd tea" x="584" y="122">AFTER Set-NetConnectionProfile</text>

  <!-- packet in -->
  <text class="mono mut" x="280" y="164" text-anchor="middle">inbound  tcp/22</text>
  <text class="mono mut" x="800" y="164" text-anchor="middle">inbound  tcp/22</text>
  <line class="ln" x1="280" y1="176" x2="280" y2="204" marker-end="url(#p1)"/>
  <line class="ln" x1="800" y1="176" x2="800" y2="204" marker-end="url(#p1)"/>

  <!-- profile of receiving interface -->
  <rect class="bad" x="120" y="208" width="320" height="58" rx="10"/>
  <text class="sml mut" x="140" y="232">interface profile</text>
  <text class="lbl red" x="420" y="232" text-anchor="end">Public</text>
  <text class="tiny mut" x="140" y="254">the default for any newly configured NIC</text>

  <rect class="ok" x="640" y="208" width="320" height="58" rx="10"/>
  <text class="sml mut" x="660" y="232">interface profile</text>
  <text class="lbl tea" x="940" y="232" text-anchor="end">Private</text>
  <text class="tiny mut" x="660" y="254">set explicitly, per InterfaceIndex</text>

  <line class="lnr" x1="280" y1="266" x2="280" y2="298" marker-end="url(#p2)"/>
  <line class="lng" x1="800" y1="266" x2="800" y2="298" marker-end="url(#p3)"/>

  <!-- the rule (identical both sides) -->
  <rect class="box" x="120" y="302" width="320" height="90" rx="10"/>
  <text class="mono ink" x="140" y="326">OpenSSH SSH Server (sshd)</text>
  <text class="mono mut" x="140" y="350">Enabled  : True</text>
  <text class="mono mut" x="140" y="372">Profile  : Private</text>

  <rect class="box" x="640" y="302" width="320" height="90" rx="10"/>
  <text class="mono ink" x="660" y="326">OpenSSH SSH Server (sshd)</text>
  <text class="mono mut" x="660" y="350">Enabled  : True</text>
  <text class="mono mut" x="660" y="372">Profile  : Private</text>

  <line class="lnr" x1="280" y1="392" x2="280" y2="424" marker-end="url(#p2)"/>
  <text class="tiny red" x="296" y="412">profile mismatch — rule never applies</text>
  <line class="lng" x1="800" y1="392" x2="800" y2="424" marker-end="url(#p3)"/>
  <text class="tiny tea" x="816" y="412">match</text>

  <!-- verdict -->
  <rect class="bad" x="120" y="428" width="320" height="46" rx="10"/>
  <text class="lbl red" x="280" y="457" text-anchor="middle">dropped by default inbound block</text>

  <rect class="ok" x="640" y="428" width="320" height="46" rx="10"/>
  <text class="lbl tea" x="800" y="457" text-anchor="middle">delivered to sshd</text>

  <!-- footer -->
  <text class="sml mut" x="540" y="540" text-anchor="middle">Both sides pass every check you would think to run</text>
  <text class="mono mut" x="516" y="568" text-anchor="end">Get-NetTCPConnection → LISTENING 0.0.0.0:22</text>
  <text class="mono mut" x="564" y="568">Get-NetFirewallRule → Enabled: True</text>
</svg>

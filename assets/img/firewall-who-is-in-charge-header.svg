<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Banner: a packet crossing the netfilter pipeline, where prerouting, forward and postrouting each carry rules written by three different owners: your own config, Docker and libvirt.">
  <style>
    .bg   { fill: #12161c; }
    .edge { fill: none; stroke: #2b333e; stroke-width: 2; }
    .box  { fill: #1b212a; stroke: #3a4451; stroke-width: 1.5; }
    .ink  { fill: #eaeef4; }
    .mut  { fill: #98a3b0; }
    .ln   { stroke: #7f8b99; stroke-width: 2.5; fill: none; }
    .rule { stroke: #2b333e; stroke-width: 1; }
    .head { font: 700 56px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .sub  { font: 400 20px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .kick { font: 700 16px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 3px; }
    .lbl  { font: 700 20px Menlo, Consolas, monospace; }
    .sml  { font: 400 15px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .foot { font: 400 17px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .own1 { fill: #6fa8e6; }
    .own2 { fill: #35c1b6; }
    .own3 { fill: #b18cf5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8b99"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="630"/>
  <rect class="edge" x="1" y="1" width="1198" height="628"/>

  <!-- header block -->
  <text class="kick mut" x="72" y="112">NFTABLES · IPTABLES-NFT · DOCKER · LIBVIRT</text>
  <text class="head ink" x="72" y="178">Three owners, one packet path</text>
  <text class="sub mut" x="72" y="216">nftables, Docker and libvirt all write into the same kernel ruleset</text>

  <!-- legend -->
  <circle class="own1" cx="840" cy="107" r="7"/><text class="sml mut" x="856" y="112">your rules</text>
  <circle class="own2" cx="960" cy="107" r="7"/><text class="sml mut" x="976" y="112">docker</text>
  <circle class="own3" cx="1060" cy="107" r="7"/><text class="sml mut" x="1076" y="112">libvirt</text>

  <line class="rule" x1="72" y1="256" x2="1128" y2="256"/>

  <!-- pipeline -->
  <text class="sml mut" x="88" y="316">packet in</text>
  <text class="sml mut" x="1112" y="316" text-anchor="end">out</text>

  <line class="ln" x1="88" y1="372" x2="180" y2="372" marker-end="url(#ah)"/>

  <rect class="box" x="188" y="330" width="176" height="84" rx="12"/>
  <text class="lbl ink" x="276" y="380" text-anchor="middle">prerouting</text>
  <circle class="own1" cx="266" cy="452" r="7"/><circle class="own2" cx="286" cy="452" r="7"/>

  <line class="ln" x1="364" y1="372" x2="396" y2="372" marker-end="url(#ah)"/>

  <rect class="box" x="404" y="330" width="176" height="84" rx="12"/>
  <text class="lbl ink" x="492" y="380" text-anchor="middle">routing</text>
  <text class="sml mut" x="492" y="457" text-anchor="middle">kernel only</text>

  <line class="ln" x1="580" y1="372" x2="612" y2="372" marker-end="url(#ah)"/>

  <rect class="box" x="620" y="330" width="176" height="84" rx="12"/>
  <text class="lbl ink" x="708" y="380" text-anchor="middle">forward</text>
  <circle class="own1" cx="688" cy="452" r="7"/><circle class="own2" cx="708" cy="452" r="7"/><circle class="own3" cx="728" cy="452" r="7"/>

  <line class="ln" x1="796" y1="372" x2="828" y2="372" marker-end="url(#ah)"/>

  <rect class="box" x="836" y="330" width="176" height="84" rx="12"/>
  <text class="lbl ink" x="924" y="380" text-anchor="middle">postrouting</text>
  <circle class="own1" cx="904" cy="452" r="7"/><circle class="own2" cx="924" cy="452" r="7"/><circle class="own3" cx="944" cy="452" r="7"/>

  <line class="ln" x1="1012" y1="372" x2="1112" y2="372" marker-end="url(#ah)"/>

  <text class="foot mut" x="72" y="560">every stage carries rules from more than one writer — and none of them asked the others first</text>
</svg>

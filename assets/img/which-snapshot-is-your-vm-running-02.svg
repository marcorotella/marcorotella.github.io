<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-label="Diagram: the backup file holds only the blocks written after the snapshot was taken. Every other block has to be resolved through the backing file declared in its header, win11.qcow2, which is not present on any disk, so those reads cannot be satisfied. qemu-img info prints the declared backing file without complaining.">
  <style>
    .g   { fill: #eef1f5; }
    .box { fill: #ffffff; stroke: #b3bcc7; stroke-width: 1.5; }
    .dim { fill: none; stroke: #d8a29c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .blk { fill: #ffffff; stroke: #b3bcc7; stroke-width: 1.5; }
    .fil { fill: #6f7a87; stroke: none; }
    .ink { fill: #14181d; }
    .mut { fill: #5c6673; }
    .fade{ fill: #97a1ad; }
    .ln  { stroke: #6f7a87; stroke-width: 2; fill: none; }
    .bad { stroke: #c2382e; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .cut { stroke: #c2382e; stroke-width: 2.5; fill: none; }
    .red { fill: #c2382e; }
    .ttl { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .kick{ font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 1.6px; }
    .lbl { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .sml { font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .smb { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono{ font: 400 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .g   { fill: #171a1f; }
      .box { fill: #222831; stroke: #414b57; }
      .dim { stroke: #7d4a44; }
      .blk { fill: #222831; stroke: #4d5865; }
      .fil { fill: #8b95a1; }
      .ink { fill: #e9edf2; }
      .mut { fill: #9aa5b1; }
      .fade{ fill: #6a7481; }
      .ln  { stroke: #8b95a1; }
      .bad { stroke: #e8695c; }
      .cut { stroke: #e8695c; }
      .red { fill: #e8695c; }
    }
  </style>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f7a87"/>
    </marker>
    <marker id="ab2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2382e"/>
    </marker>
  </defs>

  <rect class="g" x="0" y="0" width="1080" height="400"/>
  <text class="ttl ink" x="45" y="42">A copy of an overlay is not a backup</text>

  <!-- read arrow in -->
  <text class="sml mut" x="45" y="196">guest read</text>
  <line class="ln" x1="45" y1="212" x2="128" y2="212" marker-end="url(#ar2)"/>

  <!-- the backup file -->
  <text class="kick mut" x="136" y="110">THE FILE SOMEBODY COPIED</text>
  <rect class="box" x="136" y="124" width="364" height="152" rx="10"/>
  <text class="lbl ink" x="318" y="156" text-anchor="middle">win11-backup.qcow2</text>
  <text class="sml mut" x="318" y="178" text-anchor="middle">only the blocks written since the snapshot</text>

  <rect class="blk" x="160" y="198" width="28" height="28" rx="4"/>
  <rect class="fil" x="202" y="198" width="28" height="28" rx="4"/>
  <rect class="blk" x="244" y="198" width="28" height="28" rx="4"/>
  <rect class="fil" x="286" y="198" width="28" height="28" rx="4"/>
  <rect class="fil" x="328" y="198" width="28" height="28" rx="4"/>
  <rect class="blk" x="370" y="198" width="28" height="28" rx="4"/>
  <rect class="blk" x="412" y="198" width="28" height="28" rx="4"/>
  <rect class="fil" x="454" y="198" width="28" height="28" rx="4"/>

  <rect class="fil" x="160" y="248" width="12" height="12" rx="3"/>
  <text class="sml mut" x="180" y="259">held here</text>
  <rect class="blk" x="272" y="248" width="12" height="12" rx="3"/>
  <text class="sml mut" x="292" y="259">must be read from the layer below</text>

  <!-- broken resolution -->
  <line class="ln" x1="500" y1="212" x2="558" y2="212"/>
  <line class="cut" x1="574" y1="192" x2="598" y2="232"/>
  <line class="cut" x1="598" y1="192" x2="574" y2="232"/>
  <line class="bad" x1="614" y1="212" x2="700" y2="212" marker-end="url(#ab2)"/>
  <text class="mono mut" x="586" y="170" text-anchor="middle">backing file</text>

  <!-- the missing base -->
  <text class="kick mut" x="708" y="110">DECLARED IN ITS HEADER</text>
  <rect class="dim" x="708" y="124" width="327" height="152" rx="10"/>
  <text class="lbl fade" x="871" y="180" text-anchor="middle">win11.qcow2</text>
  <text class="smb red"  x="871" y="206" text-anchor="middle">not present on any disk</text>
  <text class="sml mut"  x="871" y="230" text-anchor="middle">deleted along with the rest of the chain</text>

  <text class="smb ink" x="45" y="336">qemu-img info printed that path without a word of complaint.</text>
  <text class="sml mut" x="45" y="360">A declared backing file is a promise in a header — nothing verifies it until a read goes looking for it.</text>
</svg>

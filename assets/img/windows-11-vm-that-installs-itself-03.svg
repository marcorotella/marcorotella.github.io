<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-label="Diagram: the generated answer file uses dozens of RunSynchronousCommand entries in the windowsPE pass to write and then run a batch file, X colon pe.cmd, which sets the keyboard layout with wpeutil, loads VirtIO drivers with drvload, selects the target disk with a VBScript, partitions it with diskpart, applies the Windows image directly with dism slash Apply-Image, makes it bootable with bcdboot, copies the answer file into the Panther folder and reboots. The graphical installer, SetupPrep.exe, is never invoked.">
  <style>
    .g   { fill: #eef1f5; }
    .band{ fill: #e3e8ee; }
    .box { fill: #ffffff; stroke: #b3bcc7; stroke-width: 1.5; }
    .key { fill: #ffffff; stroke: #1c7a68; stroke-width: 2; }
    .off { fill: #ffffff; stroke: #c9d0d8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .ink { fill: #14181d; }
    .mut { fill: #5c6673; }
    .ok  { fill: #1c7a68; }
    .no  { fill: #b3261e; }
    .ln  { stroke: #6f7a87; stroke-width: 2.5; fill: none; }
    .xln { stroke: #b3261e; stroke-width: 2.5; fill: none; }
    .xci { stroke: #b3261e; stroke-width: 2.5; fill: none; }
    .ttl { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .cap { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sml { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono{ font: 400 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .monb{ font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .g   { fill: #171a1f; }
      .band{ fill: #1e222a; }
      .box { fill: #222831; stroke: #414b57; }
      .key { fill: #222831; stroke: #46c2a8; }
      .off { fill: #222831; stroke: #4a545f; }
      .ink { fill: #e9edf2; }
      .mut { fill: #9aa5b1; }
      .ok  { fill: #46c2a8; }
      .no  { fill: #f2857c; }
      .ln  { stroke: #8b95a1; }
      .xln { stroke: #f2857c; }
      .xci { stroke: #f2857c; }
    }
  </style>
  <defs>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f7a87"/>
    </marker>
  </defs>

  <rect class="g" x="0" y="0" width="1080" height="600"/>
  <text class="ttl ink" x="40" y="44">The answer file stops asking Setup to do the work, and does it</text>

  <!-- origin -->
  <rect class="key" x="40" y="72" width="1000" height="66" rx="12"/>
  <text class="cap ok" x="64" y="100">windowsPE pass</text>
  <text class="sml mut" x="64" y="124">dozens of RunSynchronousCommand entries, in sequence, that write one line each of a batch file — and then run it</text>
  <text class="monb ink" x="1016" y="112" text-anchor="end">X:\pe.cmd</text>

  <line class="ln" x1="540" y1="138" x2="540" y2="168" marker-end="url(#c3)"/>

  <!-- pipeline row 1 -->
  <rect class="box" x="40" y="176" width="230" height="78" rx="10"/>
  <text class="mono ink" x="155" y="206" text-anchor="middle">wpeutil SetKeyboardLayout</text>
  <text class="sml mut" x="155" y="230" text-anchor="middle">the question is answered,</text>
  <text class="sml mut" x="155" y="246" text-anchor="middle">not skipped</text>

  <rect class="box" x="290" y="176" width="230" height="78" rx="10"/>
  <text class="mono ink" x="405" y="206" text-anchor="middle">drvload.exe</text>
  <text class="sml mut" x="405" y="230" text-anchor="middle">VirtIO storage driver into</text>
  <text class="sml mut" x="405" y="246" text-anchor="middle">the live WinPE session</text>

  <rect class="box" x="540" y="176" width="230" height="78" rx="10"/>
  <text class="mono ink" x="655" y="206" text-anchor="middle">VBScript picks the disk</text>
  <text class="sml mut" x="655" y="230" text-anchor="middle">min/max size, index,</text>
  <text class="sml mut" x="655" y="246" text-anchor="middle">no existing partitions</text>

  <rect class="box" x="790" y="176" width="230" height="78" rx="10"/>
  <text class="mono ink" x="905" y="206" text-anchor="middle">diskpart.exe</text>
  <text class="sml mut" x="905" y="230" text-anchor="middle">partition</text>
  <text class="sml mut" x="905" y="246" text-anchor="middle">and format</text>

  <line class="ln" x1="270" y1="215" x2="286" y2="215" marker-end="url(#c3)"/>
  <line class="ln" x1="520" y1="215" x2="536" y2="215" marker-end="url(#c3)"/>
  <line class="ln" x1="770" y1="215" x2="786" y2="215" marker-end="url(#c3)"/>

  <!-- wrap -->
  <path class="ln" d="M1020,254 L1050,254 L1050,282 L30,282 L30,310 L36,310" marker-end="url(#c3)"/>

  <!-- pipeline row 2 -->
  <rect class="key" x="40" y="300" width="230" height="78" rx="10"/>
  <text class="mono ok" x="155" y="330" text-anchor="middle">dism /Apply-Image</text>
  <text class="sml mut" x="155" y="354" text-anchor="middle">Windows written straight</text>
  <text class="sml mut" x="155" y="370" text-anchor="middle">onto the volume</text>

  <rect class="box" x="290" y="300" width="230" height="78" rx="10"/>
  <text class="mono ink" x="405" y="330" text-anchor="middle">bcdboot.exe</text>
  <text class="sml mut" x="405" y="354" text-anchor="middle">makes the result</text>
  <text class="sml mut" x="405" y="370" text-anchor="middle">bootable</text>

  <rect class="box" x="540" y="300" width="230" height="78" rx="10"/>
  <text class="mono ink" x="655" y="330" text-anchor="middle">copy to Panther</text>
  <text class="sml mut" x="655" y="354" text-anchor="middle">highest-priority location:</text>
  <text class="sml mut" x="655" y="370" text-anchor="middle">no implicit search left</text>

  <rect class="box" x="790" y="300" width="230" height="78" rx="10"/>
  <text class="mono ink" x="905" y="330" text-anchor="middle">reboot</text>
  <text class="sml mut" x="905" y="354" text-anchor="middle">on to specialize</text>
  <text class="sml mut" x="905" y="370" text-anchor="middle">and oobeSystem</text>

  <line class="ln" x1="270" y1="339" x2="286" y2="339" marker-end="url(#c3)"/>
  <line class="ln" x1="520" y1="339" x2="536" y2="339" marker-end="url(#c3)"/>
  <line class="ln" x1="770" y1="339" x2="786" y2="339" marker-end="url(#c3)"/>

  <!-- never invoked -->
  <rect class="off" x="40" y="430" width="380" height="86" rx="10"/>
  <circle class="xci" cx="88" cy="473" r="18"/>
  <line class="xln" x1="79" y1="464" x2="97" y2="482"/>
  <line class="xln" x1="97" y1="464" x2="79" y2="482"/>
  <text class="monb mut" x="264" y="464" text-anchor="middle">SetupPrep.exe</text>
  <text class="sml mut" x="264" y="488" text-anchor="middle">the graphical installer</text>
  <text class="sml mut" x="264" y="506" text-anchor="middle">and its three screens</text>

  <text class="cap no" x="452" y="466">never invoked</text>
  <text class="sml mut" x="452" y="492">The screens are not skipped — they never get the opportunity to exist, whatever</text>
  <text class="sml mut" x="452" y="510">Microsoft does to that layer next.</text>

  <text class="sml mut" x="40" y="568">From &#8220;trust the platform&#8217;s discovery mechanism and configure it correctly&#8221; to &#8220;do not trust that layer at all, and replace it with a script I can read&#8221;.</text>
</svg>
